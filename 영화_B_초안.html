<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영화 티어리스트 (B안)</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 30px 20px;
    }

    .wrapper {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .action-bar input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      background: #0b1120;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
    }

    .action-bar input[type="text"]:focus {
      outline: 2px solid #3b82f6;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-secondary {
      background: #475569;
      color: white;
    }

    .board {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .tier-row {
      display: flex;
      min-height: 120px;
      border-bottom: 1px solid var(--border-color);
      background: #111c30;
    }

    .tier-row:last-child {
      border-bottom: none;
    }

    .tier-badge {
      width: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
      flex-shrink: 0;
    }

    .badge-s { background: #ef4444; }
    .badge-a { background: #f97316; }
    .badge-b { background: #eab308; }
    .badge-c { background: #22c55e; }

    .tier-slot {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px;
      align-content: flex-start;
      min-height: 120px;
    }

    .tier-slot.drag-hover {
      background: #1e293b;
      outline: 2px dashed #38bdf8;
      outline-offset: -4px;
    }

    .unrated-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
    }

    .unrated-section h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    .card {
      width: 105px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      cursor: grab;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      user-select: none;
    }

    .card:active {
      cursor: grabbing;
    }

    .card.dragging {
      opacity: 0.4;
      border-color: #38bdf8;
    }

    .card-thumbnail {
      width: 100%;
      height: 120px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
    }

    .card-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-name {
      padding: 6px;
      font-size: 12px;
      text-align: center;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-menu {
      display: flex;
      border-top: 1px solid var(--border-color);
      background: #162032;
    }

    .card-menu button {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px 0;
      font-size: 11px;
      cursor: pointer;
    }

    .card-menu button:hover {
      color: #fff;
      background: #1e293b;
    }

    .hidden-input {
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>🎬 나만의 영화 티어리스트</h1>
      <p>영화 카드를 드래그하여 원하는 등급 칸으로 분류해 보세요.</p>
    </header>

    <div class="action-bar">
      <input type="text" id="movieInput" placeholder="새 영화 제목을 입력하세요..." />
      <button class="btn btn-primary" onclick="handleAddMovie()">추가</button>
      <button class="btn btn-secondary" onclick="handleReset()">초기화</button>
    </div>

    <div class="board">
      <div class="tier-row">
        <div class="tier-badge badge-s">S</div>
        <div class="tier-slot" data-tier="S"></div>
      </div>
      <div class="tier-row">
        <div class="tier-badge badge-a">A</div>
        <div class="tier-slot" data-tier="A"></div>
      </div>
      <div class="tier-row">
        <div class="tier-badge badge-b">B</div>
        <div class="tier-slot" data-tier="B"></div>
      </div>
      <div class="tier-row">
        <div class="tier-badge badge-c">C</div>
        <div class="tier-slot" data-tier="C"></div>
      </div>
    </div>

    <div class="unrated-section">
      <h3>대기 목록 (미분류)</h3>
      <div class="tier-slot" data-tier="NONE"></div>
    </div>
  </div>

  <input type="file" id="imageUploader" class="hidden-input" accept="image/*" />

  <script>
    const STORAGE_KEY = "tierlist_movie_data_b";

    const INITIAL_TITLES = [
      "귀를 기울이면",
      "모노노케 히메",
      "센과 치히로의 행방불명",
      "마녀 배달부 키키",
      "이웃집 토토로",
      "하울의 움직이는 성",
      "바람계곡의 나우시카",
      "천공의 성 라퓨타"
    ];

    let items = [];
    let currentDraggingId = null;
    let selectedForImageId = null;

    const uploader = document.getElementById("imageUploader");
    const textInput = document.getElementById("movieInput");

    function generateId() {
      return "_" + Math.random().toString(36).substr(2, 9);
    }

    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          items = JSON.parse(saved);
        } catch (e) {
          setupDefaults();
        }
      } else {
        setupDefaults();
      }
      render();
      setupDropZones();
    }

    function setupDefaults() {
      items = INITIAL_TITLES.map(title => ({
        id: generateId(),
        title: title,
        tier: "NONE",
        image: ""
      }));
      syncStorage();
    }

    function syncStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      const slots = document.querySelectorAll(".tier-slot");
      slots.forEach(slot => (slot.innerHTML = ""));

      items.forEach(item => {
        const targetSlot = document.querySelector(`.tier-slot[data-tier="${item.tier}"]`);
        if (targetSlot) {
          targetSlot.appendChild(buildCardElement(item));
        }
      });
    }

    function buildCardElement(item) {
      const card = document.createElement("div");
      card.className = "card";
      card.draggable = true;
      card.dataset.id = item.id;

      card.addEventListener("dragstart", () => {
        currentDraggingId = item.id;
        card.classList.add("dragging");
      });

      card.addEventListener("dragend", () => {
        currentDraggingId = null;
        card.classList.remove("dragging");
      });

      const thumb = document.createElement("div");
      thumb.className = "card-thumbnail";
      if (item.image) {
        const img = document.createElement("img");
        img.src = item.image;
        thumb.appendChild(img);
      } else {
        thumb.textContent = "포스터 등록";
      }

      const name = document.createElement("div");
      name.className = "card-name";
      name.textContent = item.title;
      name.title = item.title;

      const menu = document.createElement("div");
      menu.className = "card-menu";

      const photoBtn = document.createElement("button");
      photoBtn.textContent = "사진";
      photoBtn.onclick = () => triggerUpload(item.id);

      const editBtn = document.createElement("button");
      editBtn.textContent = "수정";
      editBtn.onclick = () => promptEdit(item.id);

      const delBtn = document.createElement("button");
      delBtn.textContent = "삭제";
      delBtn.onclick = () => confirmDelete(item.id);

      menu.appendChild(photoBtn);
      menu.appendChild(editBtn);
      menu.appendChild(delBtn);

      card.appendChild(thumb);
      card.appendChild(name);
      card.appendChild(menu);

      return card;
    }

    function setupDropZones() {
      const slots = document.querySelectorAll(".tier-slot");

      slots.forEach(slot => {
        slot.addEventListener("dragover", e => {
          e.preventDefault();
          slot.classList.add("drag-hover");
        });

        slot.addEventListener("dragleave", () => {
          slot.classList.remove("drag-hover");
        });

        slot.addEventListener("drop", e => {
          e.preventDefault();
          slot.classList.remove("drag-hover");
          if (!currentDraggingId) return;

          const target = items.find(m => m.id === currentDraggingId);
          if (target) {
            target.tier = slot.dataset.tier;
            syncStorage();
            render();
          }
        });
      });
    }

    function handleAddMovie() {
      const val = textInput.value.trim();
      if (!val) return;

      items.push({
        id: generateId(),
        title: val,
        tier: "NONE",
        image: ""
      });

      textInput.value = "";
      syncStorage();
      render();
    }

    textInput.addEventListener("keypress", e => {
      if (e.key === "Enter") handleAddMovie();
    });

    function promptEdit(id) {
      const target = items.find(m => m.id === id);
      if (!target) return;
      const updated = prompt("영화 제목을 수정하세요:", target.title);
      if (updated && updated.trim()) {
        target.title = updated.trim();
        syncStorage();
        render();
      }
    }

    function confirmDelete(id) {
      const target = items.find(m => m.id === id);
      if (!target) return;
      if (confirm(`'${target.title}' 영화를 삭제하시겠습니까?`)) {
        items = items.filter(m => m.id !== id);
        syncStorage();
        render();
      }
    }

    function triggerUpload(id) {
      selectedForImageId = id;
      uploader.click();
    }

    uploader.addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file || !selectedForImageId) return;

      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          const maxW = 320;
          const scale = maxW / img.width;
          canvas.width = maxW;
          canvas.height = img.height * scale;

          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressed = canvas.toDataURL("image/jpeg", 0.75);

          const target = items.find(m => m.id === selectedForImageId);
          if (target) {
            target.image = compressed;
            syncStorage();
            render();
          }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });

    function handleReset() {
      if (confirm("초기 상태로 되돌리시겠습니까? 모든 변경사항이 사라집니다.")) {
        localStorage.removeItem(STORAGE_KEY);
        setupDefaults();
        render();
      }
    }

    init();
  </script>
</body>
</html>
